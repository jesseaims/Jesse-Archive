<style>
:root{--sbt:#d8cceb;--amt:#fff;--am:#9966CC;--am2:#7f4fb3;--soft:#efe7f9;--plum:#241838;--plum2:#34244f;--bg:#f7f4fb;--sf:#fff;--tx:#261c36;--mut:#7d7192;--ln:#e7dff1;--ok:#23a68a;--warn:#e8963f;--bad:#d9496f;--sans:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;--mono:ui-monospace,"Cascadia Code",Consolas,Menlo,monospace}
@media(prefers-color-scheme:dark){:root{--bg:#171220;--sf:#211a2d;--tx:#eee8f7;--mut:#a093b8;--ln:#352a4b;--soft:#2e2243}}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font:14px/1.45 var(--sans);background:var(--bg);color:var(--tx)}
button,input,select,textarea{font:inherit;color:inherit}a{color:var(--am)}h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:0 0 14px}small,.mut{color:var(--mut)}
.mono{font-family:var(--mono)}.ic{width:18px;height:18px;flex:none}
.app{display:grid;grid-template-columns:250px 1fr;height:100vh}
aside{background:var(--plum);color:var(--sbt);display:flex;flex-direction:column;padding:16px 12px;overflow:auto}
.brand{display:flex;align-items:center;gap:12px;font-size:17px;font-weight:600;color:var(--sbt);padding:2px 8px 14px}.brand img{width:44px;height:44px;border-radius:12px;object-fit:cover;flex:none}
aside input:not([type=checkbox]):not([type=range]){width:100%;background:color-mix(in srgb,var(--sbt) 12%,transparent);border:1px solid transparent;color:var(--sbt);border-radius:10px;padding:8px 12px;margin-bottom:10px}
aside input::placeholder{color:color-mix(in srgb,var(--sbt) 55%,transparent)}aside input:focus{outline:none;border-color:var(--am)}
.nv{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:inherit;padding:8px 10px;border-radius:9px;cursor:pointer;text-align:left}
.nv:hover{background:color-mix(in srgb,var(--sbt) 9%,transparent)}.nv.on{background:color-mix(in srgb,var(--am) 30%,transparent);color:var(--sbt)}.nv b{margin-left:auto;font-weight:400;font-size:12px;opacity:.7}
.sec{font-size:12px;color:color-mix(in srgb,var(--sbt) 60%,transparent);margin:16px 10px 4px;display:flex;justify-content:space-between;align-items:center}
.sec button{background:none;border:0;color:inherit;cursor:pointer;font-size:16px}.nv .x{display:none;margin-left:auto;opacity:.6}.nv:hover .x{display:block}.nv:hover b{display:none}
.sp{flex:1}tr.sel td{background:var(--soft)}.btn:disabled{opacity:.4;cursor:default}
main{overflow:auto;height:100vh}.split{display:grid;grid-template-columns:minmax(300px,380px) 1fr;height:100%}
#list{border-right:1px solid var(--ln);overflow:auto;background:var(--sf)}.lh{display:flex;align-items:center;justify-content:space-between;padding:16px;position:sticky;top:0;background:var(--sf);z-index:2;border-bottom:1px solid var(--ln)}
.it{display:flex;gap:12px;align-items:center;padding:10px 16px;cursor:pointer;border-bottom:1px solid var(--ln)}.it:hover{background:var(--bg)}.it.on{background:var(--soft)}
.it div{min-width:0}.it .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.it .s{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
#detail{overflow:auto;padding:24px 28px}.page{padding:28px 32px;max-width:1000px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px}.pad{padding:20px}.mt{margin-top:16px}
.fr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--ln)}.fr:last-child{border:0}
.fr label{display:block;font-size:12px;color:var(--mut)}.fr .v{word-break:break-all;white-space:pre-wrap}.fa{display:flex;gap:2px}
.ib{background:none;border:0;border-radius:8px;padding:6px;cursor:pointer;color:var(--mut)}.ib:hover{background:var(--soft);color:var(--am)}
.btn{background:var(--am);color:var(--amt);border:0;border-radius:10px;padding:8px 16px;cursor:pointer;font-weight:600}.btn:hover{background:var(--am2)}
.btn.g{background:none;color:var(--tx);border:1px solid var(--ln)}.btn.g:hover{background:var(--soft)}.btn.d{background:none;color:var(--bad);border:1px solid var(--ln)}.btn.sm{padding:4px 10px;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input:not([type=checkbox]):not([type=range]),select,textarea{width:100%;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:8px 12px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--am);outline-offset:1px}
label.f{display:block;margin-bottom:12px;font-size:12px;color:var(--mut)}label.f>*{margin-top:4px;color:var(--tx)}
.pwrow{display:flex;gap:4px;align-items:center}.pwrow input{flex:1}
.bar{height:4px;background:var(--ln);border-radius:4px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--bad);transition:.2s}
.chip{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;background:var(--soft);color:var(--am2)}
.chip.ok{background:#23a68a22;color:var(--ok)}.chip.warn{background:#e8963f22;color:var(--warn)}.chip.bad{background:#d9496f22;color:var(--bad)}
@media(prefers-color-scheme:dark){.chip{color:#c9a8ee}}
table{width:100%;border-collapse:collapse}th{text-align:left;font-weight:500;color:var(--mut);font-size:12px;padding:8px 12px}td{padding:10px 12px;border-top:1px solid var(--ln);vertical-align:middle}
.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:12px;width:fit-content;margin-bottom:16px}.tabs button{border:0;background:none;padding:6px 14px;border-radius:9px;cursor:pointer}.tabs .on{background:var(--sf);box-shadow:0 1px 3px #0002;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}.gr{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--ln)}.gv{font-size:15px;word-break:break-all}
.chk{display:flex;align-items:center;gap:8px;margin-bottom:8px;color:var(--tx);font-size:14px}.chk input{accent-color:var(--am)}
input[type=range]{accent-color:var(--am);width:100%}
.empty{text-align:center;color:var(--mut);padding:60px 20px}.empty svg{width:40px;height:40px;opacity:.5}
#modal{position:fixed;inset:0;background:#241838b0;display:none;place-items:center;z-index:20;padding:16px}#modal.on{display:grid}#modal .card{width:min(600px,100%);max-height:90vh;overflow:auto;padding:22px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--plum);color:var(--sbt);padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:30}#toast.on{opacity:1}#toast.bad{background:var(--bad)}
.lock{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,color-mix(in srgb,var(--am) 45%,var(--plum)),var(--plum) 60%);padding:16px}
.lock .card{width:min(420px,100%);padding:32px}.lock .gem{width:104px;height:104px;border-radius:26px;object-fit:cover;display:block;margin:0 auto 14px;box-shadow:0 6px 24px #9966cc55}.lock h1{text-align:center}.lock p{text-align:center;color:var(--mut)}
.code{font:600 18px var(--mono);letter-spacing:1px;text-align:center;background:var(--soft);padding:14px;border-radius:12px;margin:14px 0;word-break:break-all}
.score{font-size:44px;font-weight:700;color:var(--am)}.hr{display:flex;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--ln)}.hr span:first-child{flex:1}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;padding:20px 24px;align-items:start}
.gc{background:var(--sf);border:1px solid var(--ln);border-radius:14px;overflow:hidden}.gc:hover{border-color:var(--am)}
.gh{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 14px;border-bottom:1px solid var(--ln)}.gh b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gh .gi,.gh .av{width:28px;height:28px;border-radius:8px;font-size:13px}
.gi{width:36px;height:36px;border-radius:10px;object-fit:contain;background:#fff;padding:3px;flex:none;border:1px solid var(--ln)}
.gb{padding:12px 14px}.gl{display:flex;gap:6px;align-items:center;color:var(--mut);margin-bottom:8px;cursor:pointer}.gl:hover{color:var(--am)}.gl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bx{display:flex;align-items:center;gap:2px;background:var(--bg);border-radius:8px;padding:2px 4px 2px 10px;margin-bottom:6px;min-height:36px}.bx .v{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;word-break:normal}
.wn{color:var(--bad);font-size:12px;margin-top:2px}
.gf{display:flex;justify-content:center;align-items:center;gap:14px;padding:6px;color:var(--mut);font-size:13px;border-top:1px solid var(--ln)}.gf .ib:disabled{opacity:.25;cursor:default}
.src{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.src button{padding:20px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;border:1px solid var(--ln);background:var(--sf);border-radius:12px;cursor:pointer}.src button:hover{border-color:var(--am);background:var(--soft)}.src .ic{width:26px;height:26px;color:var(--am)}
#modal .card .card{border:0;padding:0;background:none}
.sws{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.sw{background:var(--sf);border:2px solid var(--ln);border-radius:12px;padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:center;font-size:12px}.sw:hover{border-color:var(--am)}.sw.on{border-color:var(--am);box-shadow:0 0 0 3px color-mix(in srgb,var(--am) 25%,transparent)}
.swp{position:relative;display:block;width:100%;height:46px;border-radius:8px;overflow:hidden;border:1px solid var(--ln)}.swp i{position:absolute;left:0;top:0;bottom:0;width:30%}.swp b{position:absolute;right:10px;bottom:9px;width:16px;height:16px;border-radius:50%}
input[type=color].cp{width:52px!important;height:38px;padding:2px!important;cursor:pointer}
*::-webkit-scrollbar{width:12px;height:12px}
*::-webkit-scrollbar-track,*::-webkit-scrollbar-corner{background:transparent}
*::-webkit-scrollbar-thumb{background-color:color-mix(in srgb,var(--mut) 40%,transparent);background-clip:content-box;border:3px solid transparent;border-radius:10px;min-height:40px;transition:background-color .15s}
*::-webkit-scrollbar-thumb:hover{background-color:color-mix(in srgb,var(--am) 75%,transparent);background-clip:content-box}
*::-webkit-scrollbar-thumb:active{background-color:var(--am);background-clip:content-box}
aside::-webkit-scrollbar{width:10px}
aside::-webkit-scrollbar-thumb{background-color:color-mix(in srgb,var(--sbt) 28%,transparent);background-clip:content-box}
aside::-webkit-scrollbar-thumb:hover{background-color:color-mix(in srgb,var(--am) 85%,transparent);background-clip:content-box}
@supports not selector(::-webkit-scrollbar){*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--mut) 45%,transparent) transparent}aside{scrollbar-color:color-mix(in srgb,var(--sbt) 30%,transparent) transparent}}
@media(max-width:900px){.app{grid-template-columns:1fr}aside{display:none}.split{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}
@media print{body *{visibility:hidden}#sheet,#sheet *{visibility:visible}#sheet{position:absolute;inset:0}}

async function api(n,b={}){
 const r=await fetch('/api/'+n,{method:'POST',headers:{'X-Token':TOKEN,'Content-Type':'application/json'},body:JSON.stringify(b)});
 const j=await r.json().catch(()=>({error:'Risposta non valida'}));
 if(j.locked){S.d=null;boot();throw j}
 if(!r.ok)throw j; if(j.state)S.d=j.state; return j}

function pickImage(cb){const f=$('#file');f.value='';f.accept='image/*';f.onchange=()=>{const x=f.files[0];f.accept='';if(!x)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,96/Math.max(im.width,im.height));c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/png'))};im.onerror=()=>toast('Immagine non valida',1);im.src=r.result};r.readAsDataURL(x)};f.click()}

const bitsOf=p=>{if(!p)return 0;const pool=(/[a-z]/.test(p)?26:0)+(/[A-Z]/.test(p)?26:0)+(/\d/.test(p)?10:0)+(/[^A-Za-z0-9]/.test(p)?32:0);const u=new Set(p).size;return Math.max(1,u+.3*(p.length-u))*Math.log2(Math.max(pool,2))};

async function boot(){
 const st=await api('status').catch(()=>null); if(!st)return;
 if(!st.unlocked){S.d=null;S.lock??={mode:st.exists?'unlock':'create'};S.lock.path=st.path;S.lock.exists=st.exists;return lockScreen()}
 if(!S.d)await api('state').then(j=>S.d=j); S.lock=null; render(); fetchLogos()}

 else h=`<h1>Jesse's Archive</h1><p>Il tuo vault è bloccato.</p><form data-form="unlock"><label class="f">Password principale<input name="p" type="password" autocomplete="current-password" autofocus></label><button class="btn" style="width:100%">Sblocca</button></form><p><a href="#" data-act="lockmode" data-m="recover">Password dimenticata?</a></p>`;
 if(m==='link')h=`<h1>Collega un vault esistente</h1><p>Indica la cartella sincronizzata (OneDrive, Dropbox, iCloud Drive…) dove si trova la cartella <b>JesseArchive</b> creata sull'altro dispositivo.</p><div id="sug" class="row" style="margin-bottom:10px"></div><form data-form="link"><label class="f">Cartella<input name="p" placeholder="es. C:/Users/Jesse/OneDrive" autofocus></label><button class="btn" style="width:100%">Collega</button></form><p><a href="#" data-act="lockmode" data-m="back">Indietro</a></p>`;

/* ---------------- struttura ---------------- */
function render(){
 if(S.d)applyTheme(S.d.settings.theme);
 clearInterval(S.tm);const sc=$('#list')?.scrollTop||0,ms=$('main')?.scrollTop||0;
 $('#root').innerHTML=`<div class="app"><aside>${sidebar()}</aside><main>${mainView()}</main></div>`;
 const v=S.view;if($('#list'))$('#list').scrollTop=sc;$$('[data-sb]').forEach(i=>i.dispatchEvent(new Event('input',{bubbles:true})));
 if(v==='gen')genMount($('#gen'),null);
 if(v==='health')loadHealth();
 if(v==='settings')loadSug();
 if($('main'))$('main').scrollTop=ms;
 if(isGrid()){if(S.edit)showEditModal();else if(S.mk==='detail'&&S.sel&&byId(S.sel))showDetailModal();else if(S.mk==='edit'||S.mk==='detail'){S.mk=null;hideModal()}}
 else if(!NONLIST.includes(v)&&S.sel&&!S.edit)startTotp()}
const isGrid=()=>S.view==='login';
function showEditModal(){modal(form(S.edit),'edit');$$('[data-sb]').forEach(i=>i.dispatchEvent(new Event('input',{bubbles:true})))}
function showDetailModal(){modal(detail(),'detail');startTotp()}
const redrawEdit=()=>{if(!S.edit)return;isGrid()?showEditModal():render()};
function sidebar(){
 const live=S.d.items.filter(i=>!i.trashed),cnt=v=>v==='all'?live.length:v==='trash'?S.d.items.length-live.length:v==='shared'?live.filter(i=>i.shared).length:live.filter(i=>i.type===v).length;
 const nv=(v,l,i,c)=>`<button class="nv ${S.view===v?'on':''}" data-act="nav" data-v="${v}">${ic(i)}${l}${c!=null?`<b>${c}</b>`:''}</button>`;
 return `<div class="brand">${GEM}Jesse's Archive</div><input id="q" placeholder="Cerca…" value="${esc(S.q)}" autocomplete="off">
 ${NAV.map(([v,l])=>nv(v,l,v==='all'?'all':v,cnt(v))).join('')}
 <div class="sec">Cartelle<button data-act="newfolder" title="Nuova cartella">+</button></div>
 ${S.d.folders.map(f=>`<button class="nv ${S.view==='f:'+f.id?'on':''}" data-act="nav" data-v="f:${f.id}">${ic('folder')}${esc(f.name)}<b>${live.filter(i=>i.folder===f.id).length}</b><span class="x" data-act="delfolder" data-id="${f.id}">✕</span></button>`).join('')||'<div class="sec" style="margin-top:0">Nessuna cartella</div>'}
 <div class="sec">Strumenti</div>${TOOLS.map(([v,l])=>nv(v,l,v)).join('')}<div class="sp"></div>
 <button class="nv" data-act="lock">${ic('lock')}Blocca</button>`}
function mainView(){
 const v=S.view;
 if(v==='login')return gridMain();
 if(v==='archive')return archive();
 if(v==='gen')return `<div class="page"><h1>Generatore</h1><p class="mut">Ogni password copiata, salvata o usata finisce nell'Archivio password.</p><div id="gen" class="card pad mt"></div></div>`;
 if(v==='health')return `<div class="page"><h1>Salute password</h1><p class="mut">Analisi delle password attuali dei tuoi elementi.</p><div id="hbody" class="mt"></div></div>`;
 if(v==='breach')return `<div class="page"><h1>Scanner violazioni</h1><p class="mut">Controlla se le tue password compaiono in violazioni note (Have I Been Pwned). Viene inviato solo un prefisso di 5 caratteri dell'hash: la password non lascia mai il tuo computer.</p><div class="mt"><button class="btn" data-act="breachrun">Avvia scansione</button></div><div id="bbody" class="card mt" style="display:none"></div></div>`;
 if(v==='emergency')return emergency();
 if(v==='settings')return settings();
 return `<div class="split"><div id="list">${listHtml()}</div><div id="detail">${detail()}</div></div>`}
function items(){
 const v=S.view,q=S.q.toLowerCase();
 let L=S.d.items.filter(i=>v==='trash'?i.trashed:!i.trashed);
 if(T[v])L=L.filter(i=>i.type===v);else if(v==='shared')L=L.filter(i=>i.shared);else if(v.startsWith('f:'))L=L.filter(i=>i.folder===v.slice(2));
 if(q)L=L.filter(i=>(i.title+' '+T[i.type].f.filter(f=>!f[2]).map(f=>i.f[f[0]]||'').join(' ')+' '+(i.notes||'')).toLowerCase().includes(q));
 return L.sort((a,b)=>(b.fav-a.fav)||a.title.localeCompare(b.title))}
function sub(i){const f=i.f||{};return i.type==='card'?(f.number?'•••• '+f.number.slice(-4):f.holder||''):i.type==='personal'?f.fullname||f.email||'':i.type==='crypto'?f.platform||'':i.type==='note'?(i.notes||'').split('\n')[0]:f.username||f.url||''}
S.sm=false;S.bs=new Set();
const visIds=()=>items().map(i=>i.id),selVis=()=>visIds().filter(id=>S.bs.has(id));
function refreshList(){const l=$('#list');if(!l)return;const st=l.scrollTop;l.innerHTML=listHtml();l.scrollTop=st}
function bulkHead(L){const n=selVis().length,all=L.length&&n===L.length,d=n?'':'disabled';
 return `<div class="lh" style="flex-direction:column;align-items:stretch;gap:10px"><div class="row" style="justify-content:space-between"><label class="chk" style="margin:0"><input type="checkbox" data-act="ball" ${all?'checked':''}> <b>${n}</b> <span class="mut">di ${L.length} selezionati</span></label><button class="btn g sm" data-act="bdone">Fine</button></div>
 <div class="row">${S.view==='trash'?`<button class="btn sm" data-act="bop" data-op="restore" ${d}>Ripristina</button><button class="btn d sm" data-act="bop" data-op="delete" ${d}>Elimina definitivamente</button>`:`<button class="btn d sm" data-act="bop" data-op="trash" ${d}>Sposta nel cestino</button><button class="btn g sm" data-act="bmove" ${d}>Sposta in cartella…</button>`}</div></div>`}
function listHtml(){
 const L=items(),v=S.view,title=T[v]?.n||(v==='shared'?'Elementi condivisi':v==='trash'?'Cestino':v.startsWith('f:')?S.d.folders.find(f=>'f:'+f.id===v)?.name:'Tutti gli elementi');
 const acts=(v==='trash'?`<button class="btn d sm" data-act="emptytrash">Svuota</button>`:v==='shared'?`<button class="btn g sm" data-act="importshare">Importa</button>`:`<button class="btn sm" data-act="new">+ Nuovo</button>`)+(L.length?`<button class="btn g sm" data-act="bstart">Seleziona</button>`:'');
 const head=S.sm?bulkHead(L):`<div class="lh"><div><b>${esc(title)}</b> <small>${L.length}</small></div><div class="row">${acts}</div></div>`;
 if(!L.length)return head+`<div class="empty">${ic(T[v]?v:'all')}<p>${v==='trash'?'Il cestino è vuoto.':v==='shared'?'Condividi un elemento dal suo menu: verrà esportato in un pacchetto cifrato.':S.q?'Nessun risultato.':'Qui non c\'è ancora nulla.'}</p>${v!=='trash'&&v!=='shared'&&!S.q?'<button class="btn" data-act="new">Aggiungi il primo elemento</button>':''}</div>`;
 return head+L.map(i=>S.sm?`<div class="it ${S.bs.has(i.id)?'on':''}" data-act="bsel" data-id="${i.id}"><input type="checkbox" ${S.bs.has(i.id)?'checked':''} tabindex="-1" style="width:auto;pointer-events:none;accent-color:var(--am)">${rowAv(i)}<div><div class="t">${i.fav?'★ ':''}${esc(i.title)}</div><div class="s">${esc(sub(i))}</div></div></div>`:`<div class="it ${S.sel===i.id?'on':''}" data-act="sel" data-id="${i.id}">${rowAv(i)}<div><div class="t">${i.fav?'★ ':''}${esc(i.title)}</div><div class="s">${esc(sub(i))}</div></div></div>`).join('')}
function detail(){
 if(S.edit)return form(S.edit);
 const it=S.sel&&byId(S.sel);
 if(!it)return `<div class="empty">${ic('lock')}<p>${S.sm?'Spunta gli elementi nella lista (Maiusc+clic per un intervallo) e scegli un\'azione in alto.':'Seleziona un elemento per vederne i dettagli.'}</p></div>`;
 const t=T[it.type],fold=S.d.folders.find(f=>f.id===it.folder);
 const rows=t.f.map(f=>fieldRow(it,f)).join('')+(it.f.totp?`<div class="fr"><div><label>Codice 2FA</label><span class="v mono" id="otp" style="font-size:18px">······</span> <small id="otpt"></small></div><div class="fa">${btn('copyotp','copy',{},'Copia codice')}</div></div>`:'')+(it.notes?`<div class="fr"><div><label>${it.type==='note'?'Contenuto':'Note'}</label><span class="v">${esc(it.notes)}</span></div></div>`:'');
 return `<div class="row" style="justify-content:space-between;margin-bottom:16px"><div class="row">${rowAv(it)}<div><h1>${esc(it.title)}</h1><small>${t.one}${fold?' · '+esc(fold.name):''} · aggiornato il ${fmt(it.updated)}</small></div></div>
 <div class="row">${it.trashed?`<button class="btn g" data-act="restore" data-id="${it.id}">Ripristina</button><button class="btn d" data-act="delperm" data-id="${it.id}">Elimina</button>`:`${btn('fav','star',{id:it.id},'Preferito')}<button class="btn g" data-act="share" data-id="${it.id}">Condividi</button><button class="btn" data-act="edit" data-id="${it.id}">Modifica</button><button class="btn d" data-act="trash" data-id="${it.id}">Cestino</button>`}</div></div>
 <div class="card pad">${rows||'<span class="mut">Nessun dato.</span>'}</div>${history(it)}`}
function fieldRow(it,[k,l,s]){const v=it.f[k];if(!v)return'';
 const val=s?'<span class="v mono">••••••••••</span>':k==='url'?`<a class="v" href="${esc(/^https?:/.test(v)?v:'https://'+v)}" target="_blank" rel="noopener">${esc(v)}</a>`:`<span class="v">${esc(v)}</span>`;
 return `<div class="fr"><div><label>${l}</label>${val}</div><div class="fa">${s?btn('rev','eye',{id:it.id,k},'Mostra'):''}${btn('copy','copy',{id:it.id,k},'Copia')}</div></div>`}
function history(it){
 if(!SEC[it.type])return '';
 const L=S.d.passwords.filter(p=>p.item_id===it.id).sort((a,b)=>(b.active-a.active)||((b.linked||b.created)-(a.linked||a.created)));
 if(!L.length)return '';
 return `<div class="card pad mt"><h2>Cronologia password</h2>${L.map(p=>`<div class="fr"><div><span class="chip ${p.active?'ok':''}">${p.active?'Attuale':'Precedente'}</span> <small>dal ${fmt(p.linked||p.created)}${p.retired?' al '+fmt(p.retired):''} · ${srcName(p.source)}</small><br><span class="v mono" data-mask>••••••••••</span></div><div class="fa">${btn('rev','eye',{pid:p.id})}${btn('copy','copy',{pid:p.id})}${p.active?'':`<button class="btn g sm" data-act="restorepw" data-pid="${p.id}" data-id="${it.id}">Ripristina</button>`}</div></div>`).join('')}</div>`}
const srcName=s=>({generated:'generata',manual:'inserita a mano',imported:'importata'}[s]||s);
const regDom=h=>{const p=h.split('.').filter(Boolean);if(p.length<=2)return p.join('.');const a=p[p.length-2],b=p[p.length-1];return b.length===2&&/^(co|com|org|net|gov|ac|edu)$/.test(a)?p.slice(-3).join('.'):p.slice(-2).join('.')};
function siteDomain(s){s=(s||'').trim().toLowerCase();if(!s)return'';if(s.includes('@')&&!s.includes('/'))s=s.split('@').pop();s=s.replace(/^[a-z]+:\/\//,'').split(/[\/?#]/)[0].replace(/^.*@/,'').replace(/:\d+$/,'').replace(/^www\./,'');return/^[a-z0-9.-]+\.[a-z]{2,}$/.test(s)?regDom(s):s}
function groupOf(it){const src=it.src||(it.f.url?'web':'other');let k,n;
 if(it.gk){k=it.gk}else if(src==='web'){n=siteDomain(it.f.url);k='web:'+n}else{k='other:'+it.title.toLowerCase();n=it.title}
 const m=S.d.groups?.[k]||{};return{k,name:m.name||n||it.title,icon:m.icon||'',src:m.src||src}}
const gimg=(ic,n)=>ic?`<img class="gi" src="${ic}" alt="">`:av(n||'?');
const rowAv=i=>{if(i.type==='login'){const g=groupOf(i);return gimg(g.icon,g.name)}return av(i.title)};
function loginGroups(all){const q=all?'':S.q.toLowerCase(),M=new Map();S.reuse={};
 S.d.items.filter(i=>i.type==='login'&&!i.trashed).forEach(i=>{const g=groupOf(i);if(!M.has(g.k))M.set(g.k,{...g,items:[]});M.get(g.k).items.push(i);if(i.f.password)S.reuse[i.f.password]=(S.reuse[i.f.password]||0)+1});
 let L=[...M.values()];if(q)L=L.filter(g=>g.name.toLowerCase().includes(q)||g.items.some(i=>(i.title+' '+(i.f.username||'')+' '+(i.f.url||'')).toLowerCase().includes(q)));
 L.forEach(g=>g.items.sort((a,b)=>(b.fav-a.fav)||a.title.localeCompare(b.title)));
 return L.sort((a,b)=>(b.items.some(i=>i.fav)-a.items.some(i=>i.fav))||a.name.localeCompare(b.name))}
function attn(it){const p=it.f.password;if(!p)return'';if(S.reuse[p]>1)return'Password usata in più account';if(bitsOf(p)<60||p.length<8)return'La password richiede attenzione';
 const w=S.d.passwords.find(x=>x.item_id===it.id&&x.active);return w&&Date.now()/1000-(w.linked||w.created)>S.d.settings.old_days*86400?'Password vecchia: valuta di cambiarla':''}
S.ci={};
function card(g){const i=Math.max(0,Math.min(S.ci[g.k]||0,g.items.length-1)),it=g.items[i],f=it.f,w=attn(it),k=esc(g.k);
 return `<div class="gc"><div class="gh">${gimg(g.icon,g.name)}<b title="${esc(g.name)}">${esc(g.name)}</b>${btn('fav','star',{id:it.id},'Preferito')}${btn('gmenu','more',{k:g.k,id:it.id},'Altro')}</div>
 <div class="gb"><div class="gl" data-act="opendet" data-id="${it.id}" title="Apri i dettagli">${ic('personal')}<span>${esc(it.title)}</span></div>
 <div class="bx"><span class="v">${esc(f.username||'—')}</span>${f.username?btn('copy','copy',{id:it.id,k:'username'},'Copia'):''}</div>
 <div class="bx"><span class="v mono">••••••••••</span>${btn('rev','eye',{id:it.id,k:'password'},'Mostra')}${btn('copy','copy',{id:it.id,k:'password'},'Copia')}</div>
 ${w?`<div class="wn">⚠ ${w}</div>`:''}</div>
 <div class="gf"><button type="button" class="ib" data-act="cnav" data-k="${k}" data-d="-1" ${i<=0?'disabled':''}>${ic('left')}</button><span>${i+1} / ${g.items.length}</span><button type="button" class="ib" data-act="cnav" data-k="${k}" data-d="1" ${i>=g.items.length-1?'disabled':''}>${ic('right')}</button></div></div>`}
function gridMain(){const L=loginGroups(),n=L.reduce((a,g)=>a+g.items.length,0);
 return `<div class="lh" style="position:static"><div><b>Password</b> <small>${L.length} siti/app · ${n} account</small></div><button class="btn" data-act="new">+ Aggiungi account</button></div>
 ${L.length?`<div class="cards">${L.map(card).join('')}</div>`:`<div class="empty">${ic('login')}<p>${S.q?'Nessun risultato.':'Qui non c\'è ancora nulla.'}</p>${S.q?'':'<button class="btn" data-act="new">Aggiungi il primo account</button>'}</div>`}`}
const srcChooser=()=>modal(`<h2>Che tipo di account vuoi aggiungere?</h2><div class="src"><button data-act="src" data-s="web">${ic('web')}Sito web / Email</button><button data-act="src" data-s="app">${ic('app')}App</button><button data-act="src" data-s="other">${ic('other')}Altro</button></div><div class="row mt"><button class="btn g" data-act="close">Annulla</button></div>`);
const appList=q=>{S.afl=(S.apps||[]).filter(a=>a.name.toLowerCase().includes(q.toLowerCase())).slice(0,200);return S.afl.map((a,i)=>`<div class="it" data-act="useapp" data-i="${i}">${av(a.name)}<div><div class="t">${esc(a.name)}</div></div></div>`).join('')||'<p class="mut">Nessuna app trovata: puoi incollare qui sotto il percorso di un programma.</p>'};
const appModal=()=>{modal(`<h2>Scegli un'app</h2><input id="aq" placeholder="Cerca tra le app del computer…" autocomplete="off"><div id="alist" style="max-height:300px;overflow:auto;margin:10px 0">${appList('')}</div><form data-form="apppath" class="row"><input name="p" placeholder="Oppure incolla il percorso di un programma (.exe)" style="flex:1"><button class="btn g">Usa</button></form><div class="row mt"><button class="btn g" data-act="close">Annulla</button></div>`);$('#aq').focus()};
async function chooseApp(name,path){toast('Carico l\'icona…');let i='';try{i=(await api('app_icon',{path})).icon}catch(e){}
 S.edit=S.edit||blank('login');Object.assign(S.edit,{src:'app',gname:name,gicon:i});S.sel=null;S.onclose=redrawEdit;closeModal()}
function collectDraft(){const fm=$('form[data-form="item"]');if(!fm||!S.edit)return;const v=Object.fromEntries(new FormData(fm)),e=S.edit;e.title=v.title;e.notes=v.notes;e.folder=v.folder||null;e.fav=!!v.fav;T[e.type].f.forEach(([k])=>{if('f_'+k in v)e.f[k]=v['f_'+k]});if('g_site' in v)e.f.url=v.g_site;if('g_name' in v)e.gname=v.g_name}
function grpUI(e){if(e.type!=='login')return'';const m=S.d.groups?.[e.gk]||{};
 if(e.src==='app')return `<div class="fr"><div class="row">${gimg(e.gicon||m.icon,e.gname)}<div><label>App</label><b>${esc(e.gname||'Nessuna app')}</b></div></div><button type="button" class="btn g sm" data-act="pickapp">Cambia app</button></div>`;
 if(e.src==='other')return `<label class="f">Nome<input name="g_name" value="${esc(e.gname||'')}" required autofocus></label><div class="row" style="margin-bottom:12px">${gimg(e.gicon||m.icon,e.gname)}<button type="button" class="btn g sm" data-act="pickicon">Scegli un'icona dal computer…</button></div>`;
 return `<label class="f">Sito web o email<input name="g_site" value="${esc(e.f.url||'')}" placeholder="epicgames.com oppure nome@gmail.com" required autofocus></label>`}
const fetchLogos=run(async()=>{if(!S.d||S.d.settings.logos===0)return;S.lt??={};const ks=[];
 S.d.items.forEach(i=>{if(i.type==='login'&&!i.trashed){const g=groupOf(i);if(g.src==='web'&&!g.icon&&!S.lt[g.k]&&!ks.includes(g.k)){S.lt[g.k]=1;ks.push(g.k)}}});
 let ch=false;for(const k of ks){const r=await api('group_logo',{key:k}).catch(()=>null);if(r&&r.found)ch=true}
 if(ch&&!$('#modal').classList.contains('on')&&!S.edit)render()});
function blank(t){const v=S.view;return{type:t,title:'',f:{},notes:'',fav:false,folder:v.startsWith('f:')?v.slice(2):null,src:'web',gname:'',gicon:''}}
function form(e){
 const t=T[e.type],sk=SEC[e.type];
 const fields=t.f.filter(f=>!(e.type==='login'&&f[0]==='url')).map(([k,l,s])=>{const val=esc(e.f[k]||'');
  if(!s)return `<label class="f">${l}<input name="f_${k}" value="${val}" autocomplete="off"></label>`;

 psel:a=>{const ids=pDel();if(a.shift&&S.plast&&ids.includes(S.plast)){const x=ids.indexOf(S.plast),y=ids.indexOf(a.id),on=!S.ps.has(a.id);ids.slice(Math.min(x,y),Math.max(x,y)+1).forEach(i=>on?S.ps.add(i):S.ps.delete(i))}else S.ps.has(a.id)?S.ps.delete(a.id):S.ps.add(a.id);S.plast=a.id;render()},
 pall:()=>{const ids=pDel(),all=ids.length&&ids.every(i=>S.ps.has(i));ids.forEach(i=>all?S.ps.delete(i):S.ps.add(i));render()},
 pbdel:run(async()=>{const ids=pSel();if(!ids.length)return;if(!confirm('Eliminare definitivamente '+ids.length+' password dall\'archivio? L\'operazione non si può annullare.'))return;const r=await api('pw_bulk',{pids:ids});S.ps=new Set();render();toast(r.count+(r.count===1?' password eliminata':' password eliminate'))}),
 pwlink:a=>{const L=S.d.items.filter(i=>!i.trashed&&SEC[i.type]);modal(`<h2>Collega a un elemento</h2><p class="mut">Diventerà la password attuale dell'elemento scelto.</p>${L.map(i=>`<div class="it" data-act="pwlinkto" data-pid="${a.pid}" data-id="${i.id}">${av(i.title)}<div><div class="t">${esc(i.title)}</div><div class="s">${T[i.type].one} · ${esc(sub(i))}</div></div></div>`).join('')||'<p class="empty">Crea prima un elemento di tipo Password.</p>'}<div class="row mt"><button class="btn g" data-act="close">Annulla</button></div>`)},
 pwlinkto:run(async a=>{await api('pw_link',{pid:a.pid,item_id:a.id});closeModal();render();toast('Password collegata')}),
 restorepw:run(async a=>{await api('pw_link',{pid:a.pid,item_id:a.id});render();toast('Password ripristinata')}),
 pwdel:run(async a=>{if(!confirm('Eliminare questa password dall\'archivio?'))return;await api('pw_del',{pid:a.pid});render()}),
 newfolder:()=>modal('<h2>Nuova cartella</h2><form data-form="folder"><label class="f">Nome<input name="n" autofocus></label><div class="row"><button class="btn">Crea</button><button type="button" class="btn g" data-act="close">Annulla</button></div></form>'),
 delfolder:run(async a=>{if(!confirm('Eliminare la cartella? Gli elementi resteranno senza cartella.'))return;await api('folder',{id:a.id,delete:true});if(S.view==='f:'+a.id)S.view='all';render()}),
 share:a=>askPass('Condividi elemento','Verrà creato un pacchetto cifrato. Comunica la passphrase al destinatario su un altro canale.',run(async p=>{const r=await api('pack',{ids:[a.id],passphrase:p});download((byId(a.id).title||'elemento')+'.jshare',r.data);closeModal();render()}),true),
 importshare:()=>pickFile(t=>askPass('Importa pacchetto','Inserisci la passphrase del pacchetto.',run(async p=>{const r=await api('unpack',{data:t,passphrase:p});closeModal();render();toast(r.count+' elementi importati')}))),
 breachrun:run(async()=>{const b=$('#bbody');b.style.display='block';b.innerHTML='<div class="pad">Controllo in corso…</div>';
  try{const r=await api('breach');b.innerHTML=`<div class="pad">${r.results.map(x=>`<div class="hr"><span>${esc(x.title)}</span><span class="chip ${x.count?'bad':'ok'}">${x.count?'Compromessa · '+x.count.toLocaleString('it-IT')+' volte':'Non trovata'}</span><button class="btn g sm" data-act="open" data-id="${x.item_id}">Apri</button></div>`).join('')||'<span class="mut">Nessuna password da controllare.</span>'}</div>`}catch(e){b.innerHTML=`<div class="pad">${esc(e.error||'Errore')}</div>`}}),
 recnew:()=>askPass('Nuovo codice di recupero','Conferma con la tua password principale.',run(async p=>{const r=await api('recovery_new',{password:p});modal(`<h2>Nuovo codice di recupero</h2><div class="code">${esc(r.recovery)}</div><p class="mut">Conservalo su carta in un posto sicuro. Il precedente non vale più.</p><div class="row"><button class="btn g" data-act="close">Fatto</button></div>`)})),
 backup:()=>askPass('Backup cifrato','Scegli una passphrase per il file di backup.',run(async p=>{const r=await api('pack',{passphrase:p});download('jesse-archive-backup-'+new Date().toISOString().slice(0,10)+'.jbackup',r.data);closeModal()}),true),
 restore_bk:()=>pickFile(t=>askPass('Ripristina backup','Inserisci la passphrase del backup. Gli elementi verranno uniti a quelli esistenti.',run(async p=>{const r=await api('unpack',{data:t,passphrase:p});closeModal();render();toast(r.count+' elementi importati')}))),
 sheet:()=>{const w=window.open('','_blank');w.document.write(`<title>Foglio di emergenza</title><body id="sheet" style="font:15px/1.7 sans-serif;max-width:680px;margin:40px auto"><h1>Jesse\'s Archive – foglio di emergenza</h1><p>Posizione del vault: <b>${esc(S.d.path)}</b></p><ol><li>Copia il programma (<b>Jesse\'s Archive.exe</b>) e la cartella <b>dati</b> sul computer.</li><li>Avvia il programma (oppure <code>python jesse_archive.py</code>).</li><li>Inserisci la password principale oppure usa “Password dimenticata?” con il codice di recupero.</li></ol><p>Codice di recupero: ____________________________________</p><p>Dove trovare la password principale: ____________________________________</p><p>Backup cifrato: ____________________________________</p><script>print()<\/script>`);w.document.close()},
 import:()=>pickFile(run(async t=>{const r=await api('import',{text:t});render();fetchLogos();toast(r.count+' elementi importati')})),
 export:run(async a=>{if(!confirm('Il file esportato NON è cifrato. Continuare?'))return;const r=await api('export',{format:a.f});download('jesse-archive-export.'+a.f,r.text)})};
const FORMS={
 create:run(async(v)=>{if(v.p!==v.p2)return toast('Le password non coincidono',1);const r=await api('create',{password:v.p});S.lock={mode:'code',code:r.recovery};lockScreen()}),
 unlock:run(async v=>{await api('unlock',{password:v.p});S.lock=null;boot()}),
 recover:run(async v=>{await api('unlock',{recovery:v.r,new_password:v.p});S.lock=null;boot();toast('Password principale reimpostata')}),
 ask:run(async(v)=>{if(askPass.confirm&&v.p!==v.p2)return toast('Le passphrase non coincidono',1);await askPass.cb(v.p)}),
 folder:run(async v=>{await api('folder',{name:v.n});closeModal();render()}),
 link:run(async v=>{await api('loc_use',{folder:v.p});S.lock={mode:'unlock'};boot();toast('Vault collegato: inserisci la password principale')}),
 locmove:run(async v=>{await api('loc_move',{folder:v.p});render();toast('Vault spostato nella cartella sincronizzata')}),
 master:run(async(v,f)=>{await api('master',{old:v.o,new:v.n});f.reset();toast('Password principale cambiata')}),
 gedit:run(async v=>{const k=S.ge.k;await api('group_edit',{key:k,name:v.n,icon:S.ge.icon});if(S.ge.icon==='-')delete S.lt?.[k];closeModal();render();fetchLogos()}),
 apppath:run(async v=>{const p=(v.p||'').trim().replace(/^"|"$/g,'');if(!p)return;await chooseApp(p.replace(/^.*[\\/]/,'').replace(/\.[^.]+$/,''),p)}),
 item:run(async(v,f)=>{const e=S.edit,fl={};T[e.type].f.forEach(([k])=>fl[k]=v['f_'+k]||'');let grp=null;
  if(e.type==='login'){
   if(e.src==='app'){if(!e.gname)return toast('Scegli prima un\'app',1);grp={key:'app:'+e.gname.toLowerCase(),name:e.gname,src:'app',icon:e.gicon||''};fl.url=''}
   else if(e.src==='other'){const n=(v.g_name||'').trim();if(!n)return toast('Dai un nome al gruppo',1);grp={key:'other:'+n.toLowerCase(),name:n,src:'other',icon:e.gicon||''};fl.url=''}
   else{const site=(v.g_site||'').trim(),d=siteDomain(site);if(!d)return toast('Indica un sito o una email',1);fl.url=site;if(site.includes('@')&&!site.includes('/')&&!fl.username)fl.username=site;grp={key:'web:'+d,name:d,src:'web',icon:''}}}
  const title=(v.title||'').trim()||(grp?(fl.username||grp.name):'');
  const r=await api('item',{id:e.id,type:e.type,title,notes:v.notes,folder:v.folder||null,fav:!!v.fav,f:fl,group:grp});S.sel=r.id;S.edit=null;render();toast('Salvato');fetchLogos()})};

document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;if(a.tagName==='A')e.preventDefault();const f=ACT[a.dataset.act];if(f){e.stopPropagation();f({...a.dataset,target:a,shift:e.shiftKey})}else if(e.target.id==='modal')closeModal()});
$('#modal').addEventListener('mousedown',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();const ar=S.view==='archive';if((ar?S.pm:S.sm)&&(e.ctrlKey||e.metaKey)&&e.key==='a'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();ACT[ar?'pall':'ball']()}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;FORMS[f.dataset.form]?.(Object.fromEntries(new FormData(f)),f)});
document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.cp){const s=S.d.settings,th=s.theme=s.theme||{};th.preset='custom';th.custom={...CBASE,...th.custom,[t.dataset.cp]:t.value};applyTheme(th);t.nextElementSibling.textContent=t.value;return}
 if(t.id==='aq'){$('#alist').innerHTML=appList(t.value);return}
 if(t.id==='q'){S.q=t.value;if(NONLIST.includes(S.view)&&S.view!=='archive'){S.view='all'}if(S.view==='archive'||!NONLIST.includes(S.view)){const p=t.selectionStart;render();const q=$('#q');q.focus();q.setSelectionRange(p,p)}return}
 if(t.dataset.g){const k=t.dataset.g;G[k]=t.type==='checkbox'?t.checked:t.type==='number'||t.type==='range'?Number(t.value):t.value;
  if(k==='length')$$('[data-g="length"]').forEach(x=>x.value=G.length),t.closest('label')&&(t.closest('label').firstChild.nextSibling.textContent=G.length);
  clearTimeout(regen.t);regen.t=setTimeout(regen,150)}
 if(t.dataset.sb){const b=bitsOf(t.value),[l,,c]=lvl(b),w=t.closest('label');w.querySelector('.bar i').style.cssText=`width:${Math.min(100,b)}%;background:${c}`;w.querySelector('.sl').textContent=t.value?l+' · '+Math.round(b)+' bit':''}});
document.addEventListener('change',run(async e=>{if(e.target.dataset.cp){await api('settings',{theme:S.d.settings.theme});render();return}const pk=e.target.dataset.pref;if(pk){await api('prefs_set',{[pk]:e.target.value});render();toast('Impostazione salvata');return}const k=e.target.dataset.set;if(k){await api('settings',{[k]:e.target.value});toast('Impostazione salvata')}}));
let lastTouch=0;['mousemove','keydown','click'].forEach(ev=>addEventListener(ev,()=>{if(S.d&&Date.now()-lastTouch>20000){lastTouch=Date.now();api('touch').catch(()=>{})}}));
setInterval(async()=>{try{const r=await api('ping');if(S.d&&!r.unlocked){S.d=null;S.lock={mode:'unlock'};closeModal();boot()}else if(S.d){if(S.rev!=null&&r.rev!==S.rev){S.d=await api('state');if(!S.edit&&!$('#modal').classList.contains('on')&&S.view!=='gen'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){render();toast('Aggiornato da un altro dispositivo')}}S.rev=r.rev}}catch(e){if(!e.locked&&!document.getElementById('bye')){document.body.insertAdjacentHTML('beforeend','<div id="bye" class="lock" style="position:fixed;inset:0;z-index:99"><div class="card"><h1>Jesse’s Archive è stato chiuso</h1><p>Puoi chiudere questa scheda. Riavvia il programma per riaprire il vault.</p></div></div>')}}},5000);
boot();
