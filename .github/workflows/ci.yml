name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Formatting check (Prettier + rustfmt)
        run: npm run format:check

      - name: TypeScript type check
        run: npx tsc --noEmit

      # tauri::generate_context!() needs ../dist at compile time.
      # Plain vite build: `npm run build` would rewrite src/commits.generated.json.
      - name: Build frontend bundle
        run: npx vite build

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # Every clippy warning fails the build (app, tests and the native host).
      - name: Rust lints (clippy)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Browser extension tests
        run: npm run test:browser

      - name: Translations complete in every language
        run: npm run test:i18n

      - name: Dashboard (model and UI in jsdom)
        run: npm run test:dashboard

      - name: Quick Search (engine and window in jsdom)
        run: npm run test:quick-search

      - name: Window permissions match the commands each window uses
        run: npm run test:capabilities

      - name: Build native messaging host
        run: cargo build --manifest-path src-tauri/Cargo.toml --release --bin jesse_browser_host

      - name: Native messaging host tests
        run: node --test tests/browser-host.test.mjs
